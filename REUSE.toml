# Licences of the files in this repository (REUSE).
#
# Two ways a file says its licence, by folder:
# - apps/worker and packages/*: every source file carries an SPDX header, as in RetroBeam and FokusBeam,
#   where part of this code comes from (docs/HERKUNFT.md).
# - everything else, the web app in apps/web first of all, carries none: it grew from the sebaro starter, whose
#   files have no headers, and a header in each would make every later comparison with the starter noisy. The
#   first annotation below covers those files.
# When several annotations match a path, the last one wins: the general rule comes first, then the sebaro copy, its
# fonts and the marks narrow it.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sebastian Grundhöfer"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The sebaro design-system copy: written by sebaro's export, never edited here.
[[annotations]]
path = "apps/web/src/sebaro/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sebastian Grundhöfer (sebaro)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "apps/web/src/sebaro/fonts/web/sebaro-sans-*"
precedence = "override"
SPDX-FileCopyrightText = ["2019 The Radio-Canada Project Authors", "2026 Sebastian Grundhöfer (sebaro)"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "apps/web/src/sebaro/fonts/web/sebaro-mono-*"
precedence = "override"
SPDX-FileCopyrightText = ["2017 IBM Corp.", "2026 Sebastian Grundhöfer (sebaro)"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "apps/web/src/sebaro/brand/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sebastian Grundhöfer"
SPDX-License-Identifier = "LicenseRef-sebaro-reserved"

# Not narrowed, and not a work of this repository: apps/web/licences/ holds the standard texts of other licences,
# which the build puts beside a dependency that ships none. `reuse lint` never ran on this file (docs/HERKUNFT.md).

# IdeaBeam's own files, written by the product kit of the sebaro copy from sebaro.product.json and never edited
# here (apps/web/sebaro-product/NOTICE.md): code and data are MIT like the kit; the sign, its tile, the favicons and
# icons and the drawings they are made from are marks, all rights reserved. The declaration holds the drawing of the
# sign and stands with the marks.
[[annotations]]
path = "apps/web/sebaro-product/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Sebastian Grundhöfer (sebaro)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "apps/web/sebaro.product.json",
  "apps/web/sebaro-product/sign/*.svg",
  "apps/web/sebaro-product/render/**",
  "apps/web/sebaro-product/web/icon.svg",
  "apps/web/sebaro-product/web/favicon.ico",
  "apps/web/sebaro-product/web/*.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sebastian Grundhöfer"
SPDX-License-Identifier = "LicenseRef-sebaro-reserved"

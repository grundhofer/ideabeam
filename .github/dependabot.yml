# Dependabot: once a week. npm: minor and patch updates in one pull request, a major one each on its own, at most
# five open; the root directory covers the whole pnpm workspace. The sebaro copy is no package: it is updated with
# node apps/web/src/sebaro/checks/update-copy.mjs. The Worker's test set moves together or not at all: vitest,
# @cloudflare/vitest-pool-workers and wrangler in apps/worker (AGENTS.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
